name: Update profile art

# Only the heatmap is live. The portrait and the info card are static art:
# regenerate those locally when the photo or the details change.
"on":
  schedule:
    - cron: "17 6 * * *"     # ~06:17 UTC daily
  workflow_dispatch: {}
  push:
    branches: [main]
    # Deliberately path-filtered. A blanket push trigger re-runs this on
    # every README tweak for no benefit.
    paths:
      - "scripts/fetch_contributions.py"
      - "scripts/render_heatmap_svg.py"
      - "scripts/svgkit.py"
      - ".github/workflows/update-profile-art.yml"

permissions:
  contents: write

concurrency:
  group: profile-art
  cancel-in-progress: false

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r scripts/requirements.txt

      - name: Scrape the public contribution calendar
        env:
          # Keeps the workflow portable: no username hardcoded in the script.
          GH_USER: ${{ github.repository_owner }}
        run: python scripts/fetch_contributions.py

      - name: Render the heatmap
        run: python scripts/render_heatmap_svg.py

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          # [skip ci] stops the bot's own commit from re-triggering this.
          commit_message: "chore: refresh contribution graph [skip ci]"
          file_pattern: "data/contributions.json contrib-heatmap.svg"
